### monitors (mirror: HDMI основной 1440p, eDP дублирует его 1в1 на 0x0)
monitor=HDMI-A-1,2560x1440@74.96,0x0,1
monitor=eDP-1,preferred,0x0,1,mirror,HDMI-A-1

### variables
$mod = ALT
$term = alacritty

### env (аналог dbus-update-activation-environment из sway)
env = XDG_CURRENT_DESKTOP,Hyprland
env = GTK_THEME,Adwaita:dark
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland

### input
input {
    kb_layout = us,ru
    kb_options = grp:alt_space_toggle

    accel_profile = flat
    sensitivity = 0.5

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.8
    }
}

# MX Master 3S (bluetooth) — ускорение колесика, тачпад не трогаем
device {
    name = logitech-mx-master-3s
    scroll_factor = 1.5
}

### анимации
animations {
    enabled = true
    animation = windows, 1, 3, default
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, default, slide
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    # аналог client.focused / client.unfocused из sway (gruvbox)
    col.active_border = rgb(3c3836)
    col.inactive_border = rgb(282828)
    layout = dwindle
}

dwindle {
    # dwindle:pseudotile удалён в 0.56 — псевдотайлинг теперь per-window:
    #   bind = $mod,P,pseudo  (.dispatcher: pseudo)
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# misc:vfr переехал в debug:vfr
debug {
    vfr = true
}

### автозапуск (sway exec_always -> exec-once: выполняется один раз при старте,
### не при каждом reload конфига — в Hyprland это и не нужно, конфиг сам перечитывается на лету)
exec-once = noctalia
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# nm-applet / blueman-applet убраны: в Noctalia есть свои native network/bluetooth,
# а старые GTK-иконки в трее выглядели инородно и дублировались
#exec-once = nm-applet --no-agent
#exec-once = blueman-applet
exec-once = sleep 5; exec happ # ждём трей Noctalia, иначе иконки в панели нет
exec-once = brave
exec-once = Telegram
exec-once = /home/pc/.config/hypr/fix-workspaces.sh
exec-once = hypridle  # автосон через 10 мин простоя (см. hypridle.conf)

### скриншоты
bind = ,Print,exec,grimshot copy area
bind = SHIFT,Print,exec,grimshot copy screen
bind = CTRL,Print,exec,grimshot copy active
# Ctrl+Shift+I (мизинец): скриншот области
bind = CTRL SHIFT,I,exec,grimshot copy area
bind = CTRL SHIFT,Cyrillic_sha,exec,grimshot copy area

### терминал / лаунчер / закрытие окна
bind = $mod,Return,exec,$term
bind = $mod,D,exec,noctalia msg panel-toggle launcher
bind = $mod,Q,killactive

### выход
bind = $mod SHIFT,E,exit

### фокус между окнами (vim-style)
bind = $mod,H,movefocus,l
bind = $mod,J,movefocus,d
bind = $mod,K,movefocus,u
bind = $mod,L,movefocus,r

### перемещение окон
bind = $mod SHIFT,H,movewindow,l
bind = $mod SHIFT,J,movewindow,d
bind = $mod SHIFT,K,movewindow,u
bind = $mod SHIFT,L,movewindow,r

### размер окна: ALT+- уменьшить, ALT++ увеличить (binde = с повтором при удержании)
binde = $mod, minus, resizeactive, -80 -80
binde = $mod, equal, resizeactive, 80 80
binde = $mod SHIFT, equal, resizeactive, 80 80
# numpad тоже:
binde = $mod, KP_Subtract, resizeactive, -80 -80
binde = $mod, KP_Add, resizeactive, 80 80

### рабочие столы
bind = $mod,1,workspace,1
bind = $mod,2,workspace,2
bind = $mod,3,workspace,3
bind = $mod,4,workspace,4
bind = $mod,5,workspace,5
bind = $mod,6,workspace,6
bind = $mod,7,workspace,7

bind = $mod SHIFT,1,movetoworkspace,1
bind = $mod SHIFT,2,movetoworkspace,2
bind = $mod SHIFT,3,movetoworkspace,3
bind = $mod SHIFT,4,movetoworkspace,4
bind = $mod SHIFT,5,movetoworkspace,5
bind = $mod SHIFT,6,movetoworkspace,6
bind = $mod SHIFT,7,movetoworkspace,7

### перенос рабочего стола между мониторами
bind = $mod CTRL,L,movecurrentworkspacetomonitor,r
bind = $mod CTRL,H,movecurrentworkspacetomonitor,l

### фикс столов после перетыкания HDMI: ALT+SHIFT+F чинит все (см. fix-monitor.sh)
bind = $mod SHIFT,F,exec,~/.config/hypr/fix-monitor.sh
bind = CTRL SHIFT,F,exec,~/.config/hypr/fix-monitor.sh

### громкость (vol.sh: дебаунс 100мс — клавиша дублируется двумя устройствами)
bind = $mod SHIFT,P,exec,pavucontrol
bindel = ,XF86AudioRaiseVolume,exec,/home/pc/bin/vol.sh up
bindel = ,XF86AudioLowerVolume,exec,/home/pc/bin/vol.sh down
bindl = ,XF86AudioMute,exec,/home/pc/bin/vol.sh mute
# внешняя клавиатура CX 2.4G: F11/F12 как громкость (удержание работает через bindel)
bindel = ,F11,exec,/home/pc/bin/vol.sh down
bindel = ,F12,exec,/home/pc/bin/vol.sh up

### яркость (OSD показывает Noctalia)
bindl = ,XF86MonBrightnessUp,exec,noctalia msg brightness-up
bindl = ,XF86MonBrightnessDown,exec,noctalia msg brightness-down
bind = $mod,8,exec,noctalia msg brightness-down
bind = $mod,9,exec,noctalia msg brightness-up

### быстрый запуск приложений (на Shift, чтобы Alt+T/B/P остались приложениям как Ctrl+T/B/P)
bind = $mod SHIFT,T,exec,Telegram
bind = $mod SHIFT,B,exec,brave

### как на маке: Alt работает как Ctrl для приложений (через sendshortcut в активное окно).
### Свопа модификаторов больше нет: Alt=Alt, Ctrl=Ctrl. Система ест только свои клавиши
### (Q закрыть, 1..7 столы, H/J/K/L фокус, D лаунчер), остальное уходит в приложения.
### Исключения осознанно НЕ ремапим: Q (kill), D (лаунчер), H/J/K/L (фокус), цифры (столы).
# копирование/вставка: в терминале Ctrl+Shift+C/V, везде иначе Ctrl+C/V
binde = $mod, C, exec, hyprctl activewindow | grep -qi "alacritty" && hyprctl dispatch sendshortcut "CTRL SHIFT, C, activewindow" || hyprctl dispatch sendshortcut "CTRL, C, activewindow"
binde = $mod, V, exec, hyprctl activewindow | grep -qi "alacritty" && hyprctl dispatch sendshortcut "CTRL SHIFT, V, activewindow" || hyprctl dispatch sendshortcut "CTRL, V, activewindow"
binde = $mod, X, sendshortcut, CTRL, X, activewindow
binde = $mod, A, sendshortcut, CTRL, A, activewindow
binde = $mod, Z, sendshortcut, CTRL, Z, activewindow
binde = $mod SHIFT, Z, sendshortcut, CTRL, Y, activewindow
# вкладки/окна/поиск как на маке
binde = $mod, T, sendshortcut, CTRL, T, activewindow
binde = $mod, W, sendshortcut, CTRL, W, activewindow
binde = $mod, N, sendshortcut, CTRL, N, activewindow
binde = $mod, R, sendshortcut, CTRL, R, activewindow
binde = $mod, F, sendshortcut, CTRL, F, activewindow
binde = $mod, S, sendshortcut, CTRL, S, activewindow
binde = $mod, P, sendshortcut, CTRL, P, activewindow
binde = $mod, B, sendshortcut, CTRL, B, activewindow
binde = $mod, U, sendshortcut, CTRL, U, activewindow
binde = $mod, O, sendshortcut, CTRL, O, activewindow
binde = $mod, E, sendshortcut, CTRL, E, activewindow
binde = $mod, G, sendshortcut, CTRL, G, activewindow
binde = $mod, I, sendshortcut, CTRL, I, activewindow
binde = $mod, M, sendshortcut, CTRL, M, activewindow
binde = $mod, Y, sendshortcut, CTRL, Y, activewindow

### Noctalia панели вместо иконок в баре
bind = CTRL ALT,V,exec,noctalia msg panel-toggle clipboard
bind = CTRL SHIFT,bracketleft,exec,noctalia msg panel-toggle session

# отключение тачпада/клавиатуры на 10 сек — в Hyprland нет прямого аналога swaymsg input events disable,
# управление через hyprctl keyword input:touchpad и т.п.; можно вынести в отдельный скрипт при необходимости

### правила окон (windowrulev2 deprecated -> windowrule, синтаксис через пробел)
windowrule = workspace 1 class:^(Happ)$
windowrule = workspace 4 class:^(brave-browser)$
windowrule = workspace 5 class:^(org.telegram.desktop)$
