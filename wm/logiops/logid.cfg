// LogiOps config: Logitech MX Master 3S
// Кнопка "Вперед" (cid 0x56) -> клик колесика (средняя кнопка BTN_MIDDLE)
// Клик самого колесика продолжает работать как раньше - теперь оба дают middle-click.
devices: (
{
    name: "MX Master 3S";
    buttons: (
        {
            cid: 0x56;
            action = {
                type: "Keypress";
                keys: ["BTN_MIDDLE"];
            };
        }
    );
}
);
